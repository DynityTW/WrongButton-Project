org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=60000
org.gradle.internal.repository.max.retries=6
org.gradle.internal.repository.initial.backoff=1000
# R8 用相容模式：嚴格模式（AGP 9 預設）讓正式版閃退（不經 R8 的同一版不閃退）。
# 相容模式對靠反射的程式庫比較寬鬆；AGP 10 之前都支援。
android.enableR8.fullMode=false
